vars_common_all_default_domain: "jamfox.dev"
vars_common_all_default_netblock: "192.168.0.0/16"
vars_common_all_gateway_ipv4: "192.168.10.1"
vars_common_all_gateway_intra_ipv4: "192.168.1.190"
vars_common_all_loki_ipv4: "192.168.10.50"
vars_common_all_mask_ipv4: "/24"
vars_common_all_proxy_ipv4: "192.168.10.80"
vars_common_all_dns_ipv4: "192.168.10.53"
vars_common_all_dns_default_port: "53"
vars_common_all_pve_default_ipv4: "192.168.10.100"
vars_common_all_pve_default_port: "8006"

var_common_all_consul_dns_port: "8600"

hostname: "{{ ansible_hostname }}.{{ vars_common_all_default_domain }}"
nameservers:
  - "{{ vars_common_all_dns_ipv4 }}"
searchdomain: "{{ vars_common_all_default_domain }}"

# Scripts
vars_common_all_scripts_admin:
  - name: "ansible-parallel"
    url: "https://raw.githubusercontent.com/JamFox/ansible-parallel/main/ansible-parallel"
    dest: "/usr/local/bin/"
    mode: "0774"
    owner: "{{ vars_common_all_main_user }}"
    group: "{{ vars_common_all_main_group }}"
  - name: "teams-msg"
    url: "https://raw.githubusercontent.com/JamFox/ansible-parallel/main/teams-msg"
    mode: "0774"
    owner: "{{ vars_common_all_main_user }}"
    group: "{{ vars_common_all_main_group }}"
  - name: "telegram-msg"
    url: "https://raw.githubusercontent.com/JamFox/ansible-parallel/main/telegram-msg"
    mode: "0774"
    owner: "{{ vars_common_all_main_user }}"
    group: "{{ vars_common_all_main_group }}"
  - name: ".bashrc"
    url: "https://raw.githubusercontent.com/JamFox/dotfiles/main/.bashrc"
    dest: "/home/jamfox/"
    mode: "0640"
    owner: "{{ vars_common_all_main_user }}"
    group: "{{ vars_common_all_main_group }}"
vars_common_all_scripts_vault_client:
  - name: "vault-login"
    link: "/usr/local/bin/vl"
    local: "files/vault-login.sh"
    dest: "/usr/local/bin"
    mode: "0755"
    owner: "{{ vars_common_all_main_user }}"
    group: "{{ vars_common_all_main_group }}"
  - name: "vault-ssh"
    link: "/usr/local/bin/vssh"
    local: "files/vault-ssh.sh"
    dest: "/usr/local/bin"
    mode: "0755"
    owner: "{{ vars_common_all_main_user }}"
    group: "{{ vars_common_all_main_group }}"

vars_common_all_ipsets_allow:
  - "at"
  - "be"
  - "bg"
  - "hr"
  - "cy"
  - "ch"
  - "cz"
  - "dk"
  - "ee"
  - "fi"
  - "fr"
  - "de"
