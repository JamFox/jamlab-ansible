group_vars_green_podman_users:
  - name: 'outside'
    primary_group: 'outside'
    #groups: 
    #  - "kvm" 
    #  - "libvirt" 
    #  - "libvirt-qemu"
    homedir: '/home/outside'
  - name: 'inside'
    primary_group: 'inside'
    #groups: 
    #  - "kvm" 
    #  - "libvirt" 
    #  - "libvirt-qemu"
    homedir: '/home/inside'
users: "{{ vars_common_all_main_users + group_vars_green_podman_users }}"
users_deleted: "{{ vars_common_all_users_deleted }}"

sshd: "{{ vars_common_all_default_sshd }}"

firewalld_enabled: true
firewalld_service_state: started
firewalld_remove_unmanaged: false
firewalld_zones:
  - name: "internal"
    short: "Internal"
    description: "For use on internal networks. You mostly trust the other computers on the networks to not harm your computer. Only selected incoming connections are accepted."
    source:
      - address: "172.16.0.0/12"
      - address: "192.168.0.0/16"
      - address: "10.10.0.0/16"
  - name: "trusted"
    short: "Trusted"
    description: "All network connections in trusted sources are accepted."
    target: "ACCEPT"
    source:
      - address: "192.168.0.0/16"

sysctl_items: "{{ vars_common_all_sysctl_items }}"

selinux_policy: targeted
selinux_state: enforcing

soft_epel_enabled: true
soft_packages_latest: "{{ vars_common_all_admin_packages_rocky }}"

ddclient_install_from_source: true
ddclient_conf_dir: /etc/ddclient
ddclient_api_login: "{{ vars_common_all_dns_login }}"
ddclient_api_key: "{{ vars_common_all_dns_key }}"
ddclient_api_token: "{{ vars_common_all_dns_token }}"

podman_enabled: true
podman_manual_mapping: true
podman_enable_user_socket: true
# Set uid:gid, according to https://github.com/containers/podman/blob/main/docs/tutorials/rootless_tutorial.md
podman_users:
  #inside:
  #outside:
podman_search_registries: 
  - 'registry.access.redhat.com'
  - 'docker.io'
  - 'registry.fedoraproject.org'
  - 'quay.io'
  - 'registry.centos.org'
# Use cgroupfs to support Podman in Podman
podman_configure: true
podman_conf_cgroup_manager: 'cgroupfs'

certbot_domain: "{{ vars_common_all_default_domain }}"
certbot_dns_token: "{{ vars_common_all_dns_token }}"

haproxy_domain: "{{ vars_common_all_default_domain }}"